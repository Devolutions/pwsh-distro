name: PowerShell CLI
on:
  workflow_dispatch:
    inputs:
      sdk_package_version:
        description: Optional SDK package version override (blank = use SDK_PACKAGE_VERSION)
        default: ""
        required: false
      sdk_artifact_run_id:
        description: Optional SDK workflow run ID whose nupkg artifact should be repackaged instead of SDK_PACKAGE_SOURCE
        default: ""
        required: false
      sdk_artifact_name:
        description: Optional SDK nupkg artifact name to repackage instead of SDK_PACKAGE_SOURCE
        default: ""
        required: false
      ready_to_run:
        description: Apply ReadyToRun optimization to packaged PowerShell managed assemblies
        required: true
        type: boolean
        default: false
      use_custom_dotnet_runtime:
        description: Use a source-built .NET runtime pack (from dotnet-runtime.yml) instead of the stock runtime
        required: false
        type: boolean
        default: false
      dotnet_runtime_run_id:
        description: Optional dotnet-runtime.yml run ID whose pack artifact should be used (blank = build in this workflow, latest = select latest successful runtime run, or a specific run ID to reuse its artifacts)
        default: ""
        required: false
  workflow_call:
    inputs:
      sdk_package_version:
        description: Optional SDK package version override (blank = use SDK_PACKAGE_VERSION)
        default: ""
        required: false
        type: string
      sdk_artifact_run_id:
        description: Optional SDK workflow run ID whose nupkg artifact should be repackaged instead of SDK_PACKAGE_SOURCE
        default: ""
        required: false
        type: string
      sdk_artifact_name:
        description: Optional SDK nupkg artifact name to repackage instead of SDK_PACKAGE_SOURCE
        default: ""
        required: false
        type: string
      ready_to_run:
        description: Apply ReadyToRun optimization to packaged PowerShell managed assemblies
        required: false
        type: boolean
        default: false
      use_custom_dotnet_runtime:
        description: Use a source-built .NET runtime pack (from dotnet-runtime.yml) instead of the stock runtime
        default: false
        required: false
        type: boolean
      dotnet_runtime_run_id:
        description: Optional dotnet-runtime.yml run ID whose pack artifact should be used (blank = build in this workflow, latest = select latest successful runtime run, or a specific run ID to reuse its artifacts)
        default: ""
        required: false
        type: string
permissions:
  actions: read
  contents: read
env:
  POWERSHELL_VERSION: "7.6.9"
  POWERSHELL_RELEASE_TAG: "v7.6.9"
  POWERSHELL_UPSTREAM_TAG: "upstream/v7.6.9"
  POWERSHELL_SOURCE_REPOSITORY: ${{ github.repository }}
  POWERSHELL_SOURCE_REF: "downstream/v7.6.9"
  SDK_PACKAGE_ID: "Devolutions.PowerShell.SDK"
  SDK_PACKAGE_VERSION: "7.6.9.2"
  SDK_PACKAGE_REVISION: "2"
  SDK_PACKAGE_SOURCE: "https://api.nuget.org/v3/index.json"
  MULTI_PWSH_APPHOST_VERSION: "0.14.2"
  MULTI_PWSH_APPHOST_SOURCE_REF: "77676d18baaf205ec36b1711d11bd386d4b15272"
  MULTI_PWSH_BINDINGS_POWERSHELL_VERSION: "7.4.0"
  MULTI_PWSH_RUST_TOOLCHAIN: "1.90.0"
  MULTI_PWSH_ALPINE_BUILD_IMAGE: "rust:1.90.0-alpine3.22"
  MULTI_PWSH_GLIBC_BUILD_IMAGE: "registry.access.redhat.com/ubi8/ubi:latest"
  POWERSHELL_NATIVE_PACKAGE_VERSION: "700.0.2"
  POWERSHELL_NATIVE_SOURCE_REF: "f24d5494b373de20ec3e3d2fdc7c3fc98af1f9f1"
jobs:
  build:
    name: PowerShell [${{matrix.arch}}-${{matrix.os}}]
    runs-on: ${{matrix.runner}}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            arch: x64
            runner: windows-2025
            rid: win-x64
          - os: windows
            arch: arm64
            runner: windows-2025
            rid: win-arm64
          - os: macos
            arch: x64
            runner: macos-15
            rid: osx-x64
          - os: macos
            arch: arm64
            runner: macos-15
            rid: osx-arm64
          - os: linux
            arch: x64
            runner: ubuntu-24.04
            rid: linux-x64
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            rid: linux-arm64
          - os: linux-musl
            arch: x64
            runner: ubuntu-24.04
            rid: linux-musl-x64
          - os: linux-musl
            arch: arm64
            runner: ubuntu-24.04-arm
            rid: linux-musl-arm64

    steps:
      - name: Enable Windows long path support
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Clone project with PowerShell submodule
        uses: actions/checkout@v7.0.0
        with:
          submodules: true
          fetch-depth: 0

      - name: Verify PowerShell source ref
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Invoke-GitPowerShell {
            param(
              [Parameter(Mandatory, ValueFromRemainingArguments)]
              [string[]] $Arguments
            )

            $Output = & git -C pwsh-src @Arguments
            if ($LASTEXITCODE -ne 0) {
              throw "git -C pwsh-src $($Arguments -join ' ') failed with exit code $LASTEXITCODE"
            }

            return $Output
          }

          function Test-GitCommitRef {
            param(
              [Parameter(Mandatory)]
              [string] $Ref
            )

            & git -C pwsh-src rev-parse --verify "$Ref^{commit}" *> $null
            return $LASTEXITCODE -eq 0
          }

          $ExpectedVersion = $Env:POWERSHELL_RELEASE_TAG -replace '^v', ''
          if ($Env:POWERSHELL_VERSION -ne $ExpectedVersion) {
            throw "POWERSHELL_VERSION '$Env:POWERSHELL_VERSION' does not match POWERSHELL_RELEASE_TAG '$Env:POWERSHELL_RELEASE_TAG'."
          }

          $SdkPackageVersion = '${{ inputs.sdk_package_version }}'.Trim()
          if ([string]::IsNullOrWhiteSpace($SdkPackageVersion)) {
            $SdkArtifactName = '${{ inputs.sdk_artifact_name }}'.Trim()
            if ($SdkArtifactName -match '^PowerShell-SDK-Release-(\d+\.\d+\.\d+\.\d+)$') {
              $SdkPackageVersion = $Matches[1]
            } else {
              $SdkPackageVersion = $Env:SDK_PACKAGE_VERSION
            }
          }

          $EscapedPowerShellVersion = [regex]::Escape($Env:POWERSHELL_VERSION)
          if ($SdkPackageVersion -notmatch "^$EscapedPowerShellVersion\.\d+$") {
            throw "SDK package version '$SdkPackageVersion' does not match expected PowerShell version prefix '$Env:POWERSHELL_VERSION'."
          }

          $SourceCommit = (Invoke-GitPowerShell rev-parse HEAD).Trim()
          Write-Host "PowerShell source: $Env:POWERSHELL_SOURCE_REPOSITORY@$Env:POWERSHELL_SOURCE_REF ($SourceCommit)"
          Write-Host "PowerShell SDK package: $Env:SDK_PACKAGE_ID $SdkPackageVersion from $Env:SDK_PACKAGE_SOURCE"

          $BaseRef = if ($Env:POWERSHELL_SOURCE_REPOSITORY -eq $Env:GITHUB_REPOSITORY) {
            $Env:POWERSHELL_UPSTREAM_TAG
          } else {
            $Env:POWERSHELL_RELEASE_TAG
          }

          if (-not (Test-GitCommitRef $BaseRef)) {
            throw "Expected PowerShell base tag '$BaseRef' was not found in the PowerShell checkout."
          }

          & git -C pwsh-src merge-base --is-ancestor "${BaseRef}^{commit}" HEAD
          if ($LASTEXITCODE -ne 0) {
            throw "PowerShell source ref '$Env:POWERSHELL_SOURCE_REF' is not based on '$BaseRef'."
          }

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5.3.0
        with:
          global-json-file: pwsh-src/global.json

      - name: Test Linux apphost validation
        if: runner.os == 'Linux'
        shell: pwsh
        run: ./eng/Test-LinuxAppHost.ps1

      - name: Clone pinned MultiPwsh launcher source
        if: runner.os == 'Linux'
        uses: actions/checkout@v7.0.0
        with:
          repository: Devolutions/multi-pwsh
          ref: ${{ env.MULTI_PWSH_APPHOST_SOURCE_REF }}
          path: multi-pwsh-source

      - name: Setup MultiPwsh .NET SDK
        if: runner.os == 'Linux'
        uses: actions/setup-dotnet@v5.3.0
        with:
          global-json-file: multi-pwsh-source/global.json

      - name: Clone PowerShell.Native source
        if: matrix.rid == 'linux-arm64' || matrix.rid == 'linux-musl-arm64'
        uses: actions/checkout@v7.0.0
        with:
          repository: PowerShell/PowerShell-Native
          ref: ${{ env.POWERSHELL_NATIVE_SOURCE_REF }}
          path: powershell-native-source

      - name: Verify PowerShell.Native version
        if: matrix.rid == 'linux-arm64' || matrix.rid == 'linux-musl-arm64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [xml] $Project = Get-Content -LiteralPath 'pwsh-src/src/System.Management.Automation/System.Management.Automation.csproj' -Raw
          $References = @($Project.Project.ItemGroup.PackageReference | Where-Object { $_.Include -eq 'Microsoft.PowerShell.Native' })
          if ($References.Count -ne 1 -or $References[0].Version -ne $Env:POWERSHELL_NATIVE_PACKAGE_VERSION) {
            throw "PowerShell.Native source pin does not match version $Env:POWERSHELL_NATIVE_PACKAGE_VERSION in PowerShell source."
          }

      - name: Build Linux MultiPwsh launcher
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          source_version="$(sed -n 's/^version = "\(.*\)"/\1/p' multi-pwsh-source/crates/multi-pwsh/Cargo.toml | head -n 1)"
          if [[ "$source_version" != "$MULTI_PWSH_APPHOST_VERSION" ]]; then
            echo "MultiPwsh source version $source_version does not match $MULTI_PWSH_APPHOST_VERSION" >&2
            exit 1
          fi
          if [[ "$(git -C multi-pwsh-source rev-parse HEAD)" != "$MULTI_PWSH_APPHOST_SOURCE_REF" ]]; then
            echo "MultiPwsh source commit does not match $MULTI_PWSH_APPHOST_SOURCE_REF" >&2
            exit 1
          fi

          bindings_pwsh_dir="$RUNNER_TEMP/multi-pwsh-bindings-pwsh"
          mkdir -p "$bindings_pwsh_dir"
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/PowerShell/PowerShell/releases/download/v${MULTI_PWSH_BINDINGS_POWERSHELL_VERSION}/powershell-${MULTI_PWSH_BINDINGS_POWERSHELL_VERSION}-linux-${{ matrix.arch }}.tar.gz" \
            -o "$RUNNER_TEMP/multi-pwsh-bindings-pwsh.tar.gz"
          tar -xzf "$RUNNER_TEMP/multi-pwsh-bindings-pwsh.tar.gz" -C "$bindings_pwsh_dir"
          chmod +x "$bindings_pwsh_dir/pwsh"
          bindings_pwsh_version="$("$bindings_pwsh_dir/pwsh" -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()')"
          if [[ "$bindings_pwsh_version" != "$MULTI_PWSH_BINDINGS_POWERSHELL_VERSION" ]]; then
            echo "MultiPwsh bindings require PowerShell $MULTI_PWSH_BINDINGS_POWERSHELL_VERSION, got $bindings_pwsh_version" >&2
            exit 1
          fi

          (cd multi-pwsh-source && dotnet build dotnet/bindings/Devolutions.PowerShell.SDK.Bindings.csproj -c Release "/p:PwshExePath=$bindings_pwsh_dir/pwsh")
          (cd multi-pwsh-source && dotnet build dotnet/startup-hook/Devolutions.PowerShell.SDK.StartupHook.csproj -c Release)

          if [[ "${{ matrix.os }}" == "linux-musl" ]]; then
            abi=musl
            image="$MULTI_PWSH_ALPINE_BUILD_IMAGE"
          else
            abi=glibc
            image="$MULTI_PWSH_GLIBC_BUILD_IMAGE"
          fi
          docker run --rm \
            -v "$PWD/multi-pwsh-source:/src" \
            -v "$PWD/eng:/eng:ro" \
            -w /src -e RUST_TOOLCHAIN_VERSION="$MULTI_PWSH_RUST_TOOLCHAIN" \
            "$image" sh /eng/Build-LinuxMultiPwshAppHost.sh "$abi"

          if [[ "$abi" == "glibc" ]]; then
            max_glibc="$(readelf --version-info multi-pwsh-source/pwsh-linux-apphost | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' | sort -Vu | tail -n 1)"
            if [[ -z "$max_glibc" || "$(printf '%s\n' 2.28 "${max_glibc#GLIBC_}" | sort -V | tail -n 1)" != "2.28" ]]; then
              echo "Linux launcher requires $max_glibc; RHEL 8 requires glibc 2.28 or older" >&2
              exit 1
            fi
          fi

      - name: Build ARM64 PowerShell native library
        if: matrix.rid == 'linux-arm64' || matrix.rid == 'linux-musl-arm64'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git -C powershell-native-source rev-parse HEAD)" != "$POWERSHELL_NATIVE_SOURCE_REF" ]]; then
            echo "PowerShell.Native source commit does not match $POWERSHELL_NATIVE_SOURCE_REF" >&2
            exit 1
          fi
          if [[ "${{ matrix.rid }}" == "linux-musl-arm64" ]]; then
            abi=musl
            image="$MULTI_PWSH_ALPINE_BUILD_IMAGE"
          else
            abi=glibc
            image="$MULTI_PWSH_GLIBC_BUILD_IMAGE"
          fi
          docker run --rm \
            -v "$PWD/powershell-native-source:/native" \
            -v "$PWD/eng:/eng:ro" \
            "$image" sh /eng/Build-LinuxPowerShellNative.sh "$abi"
          native_library="powershell-native-source/pwsh-native-$abi-arm64.so"
          readelf -h "$native_library" | grep -q 'AArch64'
          if [[ "$abi" == "musl" ]]; then
            readelf -d "$native_library" | grep -F 'Shared library: [libc.musl-aarch64.so.1]'
          else
            max_glibc="$(readelf --version-info "$native_library" | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' | sort -Vu | tail -n 1)"
            if [[ -z "$max_glibc" || "$(printf '%s\n' 2.28 "${max_glibc#GLIBC_}" | sort -V | tail -n 1)" != "2.28" ]]; then
              echo "PowerShell native library requires $max_glibc; RHEL 8 requires glibc 2.28 or older" >&2
              exit 1
            fi
          fi

      - name: Download current-run SDK package
        if: ${{ inputs.sdk_artifact_name != '' && inputs.sdk_artifact_run_id == '' }}
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ inputs.sdk_artifact_name }}
          path: sdk-package-source

      - name: Download previous-run SDK package
        if: ${{ inputs.sdk_artifact_run_id != '' }}
        uses: actions/download-artifact@v8.0.1
        with:
          run-id: ${{ inputs.sdk_artifact_run_id }}
          name: ${{ inputs.sdk_artifact_name || format('PowerShell-SDK-Release-{0}', inputs.sdk_package_version || env.SDK_PACKAGE_VERSION) }}
          path: sdk-package-source
          github-token: ${{ github.token }}

      - name: Resolve dotnet runtime workflow run
        if: ${{ inputs.use_custom_dotnet_runtime == true }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'

          $RequestedRunId = '${{ inputs.dotnet_runtime_run_id }}'.Trim()
          if ([string]::IsNullOrWhiteSpace($RequestedRunId)) {
            throw "use_custom_dotnet_runtime is enabled but dotnet_runtime_run_id is blank. Set it to a specific dotnet-runtime.yml run ID, or 'latest' to select the latest successful runtime run."
          }

          $ResolvedRunId = $RequestedRunId
          if ($RequestedRunId -eq 'latest') {
            $Runs = gh run list -R $Env:GITHUB_REPOSITORY -w '.NET runtime' --json databaseId,status,conclusion 2>$null | ConvertFrom-Json
            $ResolvedRunId = @($Runs | Where-Object { $_.status -eq 'completed' -and $_.conclusion -eq 'success' } | Select-Object -First 1 -ExpandProperty databaseId)
            if (-not $ResolvedRunId) {
              throw "No successful '.NET runtime' workflow runs were found to reuse."
            }
          }

          "DOTNET_RUNTIME_RUN_ID=$ResolvedRunId" | Out-File -FilePath $Env:GITHUB_ENV -Append
          Write-Host "Resolved dotnet-runtime workflow run: $ResolvedRunId"

      - name: Download source-built .NET runtime pack
        if: ${{ inputs.use_custom_dotnet_runtime == true }}
        uses: actions/download-artifact@v8.0.1
        with:
          run-id: ${{ env.DOTNET_RUNTIME_RUN_ID }}
          name: DotNet-Runtime-${{matrix.rid}}
          path: custom-runtime-source
          github-token: ${{ github.token }}

      - name: Package PowerShell distro from SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $OutputPath = Join-Path $PWD "PowerShell-$Env:POWERSHELL_VERSION-${{matrix.os}}-${{matrix.arch}}"
          $ArchivePath = "$OutputPath.tar.gz"
          $PackageScript = Join-Path (Join-Path $PWD 'eng') 'New-PowerShellDistroArchive.ps1'
          $PackageSource = $Env:SDK_PACKAGE_SOURCE
          $SdkPackageVersion = '${{ inputs.sdk_package_version }}'.Trim()
          if ([string]::IsNullOrWhiteSpace($SdkPackageVersion)) {
            $SdkArtifactName = '${{ inputs.sdk_artifact_name }}'.Trim()
            if ($SdkArtifactName -match '^PowerShell-SDK-Release-(\d+\.\d+\.\d+\.\d+)$') {
              $SdkPackageVersion = $Matches[1]
            } else {
              $SdkPackageVersion = $Env:SDK_PACKAGE_VERSION
            }
          }

          $SdkArtifactRunId = '${{ inputs.sdk_artifact_run_id }}'.Trim()
          $SdkArtifactName = '${{ inputs.sdk_artifact_name }}'.Trim()
          if ($SdkArtifactName -or $SdkArtifactRunId) {
            $PackageSource = Join-Path $PWD 'sdk-package-source'
            $SdkVersion = [version]::Parse($SdkPackageVersion)
            $NormalizedSdkVersion = if ($SdkVersion.Revision -eq 0) {
              "$($SdkVersion.Major).$($SdkVersion.Minor).$($SdkVersion.Build)"
            } else {
              $SdkVersion.ToString()
            }
            $SdkPackages = @(Get-ChildItem -LiteralPath $PackageSource -Filter "$($Env:SDK_PACKAGE_ID).$NormalizedSdkVersion.nupkg" -File)
            if ($SdkPackages.Count -ne 1) {
              $SourceDescription = if ($SdkArtifactRunId) { "SDK workflow run '$SdkArtifactRunId'" } else { "current workflow run artifact '$SdkArtifactName'" }
              throw "Expected exactly one $Env:SDK_PACKAGE_ID nupkg from $SourceDescription, found $($SdkPackages.Count)."
            }

            Write-Host "Using workflow-built SDK package: $($SdkPackages[0].FullName)"
          } else {
            Write-Host "Using SDK package source: $PackageSource"
          }

          $PackageArguments = @{
            PackageId = $Env:SDK_PACKAGE_ID
            PackageVersion = $SdkPackageVersion
            PackageSource = $PackageSource
            PowerShellVersion = $Env:POWERSHELL_VERSION
            RuntimeIdentifier = '${{matrix.rid}}'
            OutputDirectory = $OutputPath
            ArchivePath = $ArchivePath
          }
          if ('${{ inputs.ready_to_run }}' -eq 'true') {
            $PackageArguments.ReadyToRun = $true
          }
          if ('${{ matrix.os }}' -like 'linux*') {
            $PackageArguments.LinuxAppHostPath = Join-Path $PWD 'multi-pwsh-source/pwsh-linux-apphost'
            $PackageArguments.LinuxAppHostLicenseDirectory = Join-Path $PWD 'multi-pwsh-source'
          }
          if ('${{ matrix.rid }}' -in 'linux-arm64', 'linux-musl-arm64') {
            $NativeAbi = if ('${{ matrix.rid }}' -eq 'linux-musl-arm64') { 'musl' } else { 'glibc' }
            $PackageArguments.PowerShellNativeLibraryPath = Join-Path $PWD "powershell-native-source/pwsh-native-$NativeAbi-arm64.so"
            $PackageArguments.PowerShellNativeLicensePath = Join-Path $PWD 'powershell-native-source/LICENSE.txt'
          }
          $UseCustomRuntime = '${{ inputs.use_custom_dotnet_runtime }}' -ieq 'true'
          if ($UseCustomRuntime) {
            $CustomRuntimeSource = Join-Path $PWD 'custom-runtime-source'
            $RuntimePackNamePattern = '^Microsoft\.NETCore\.App\.Runtime\.' + [regex]::Escape('${{matrix.rid}}') + '\.(?<version>.+)\.nupkg$'
            $RuntimePacks = @(Get-ChildItem -LiteralPath $CustomRuntimeSource -Filter 'Microsoft.NETCore.App.Runtime.*.nupkg' -File | Where-Object {
              $_.Name -match $RuntimePackNamePattern -and $_.Name -notmatch '\.symbols\.nupkg$'
            })
            if ($RuntimePacks.Count -eq 0) {
              throw "use_custom_dotnet_runtime is enabled but no Microsoft.NETCore.App.Runtime.*.nupkg was found in $CustomRuntimeSource."
            }

            $RuntimePack = $RuntimePacks | Select-Object -First 1
            $RuntimeVersion = [regex]::Match($RuntimePack.Name, $RuntimePackNamePattern).Groups['version'].Value
            if ([string]::IsNullOrWhiteSpace($RuntimeVersion)) {
              throw "Could not determine runtime pack version from filename: $($RuntimePack.Name)"
            }

            Write-Host "Discovered custom runtime pack: $($RuntimePack.Name)"
            Write-Host "Using source-built .NET runtime: $CustomRuntimeSource (version $RuntimeVersion)"
            $PackageArguments.CustomRuntimeSource = $CustomRuntimeSource
            $PackageArguments.CustomRuntimePackageVersion = $RuntimeVersion
          }

          & $PackageScript @PackageArguments

      - name: Upload PowerShell package
        uses: actions/upload-artifact@v7.0.1
        with:
          name: PowerShell-${{env.POWERSHELL_VERSION}}-${{matrix.os}}-${{matrix.arch}}
          path: PowerShell-${{env.POWERSHELL_VERSION}}-${{matrix.os}}-${{matrix.arch}}.tar.gz
          if-no-files-found: error

  test-alpine:
    name: Test Alpine ${{ matrix.alpine }} [${{ matrix.arch }}]
    needs: build
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        alpine: ["3.22", "3.23"]
    steps:
      - name: Clone project
        uses: actions/checkout@v7.0.0

      - name: Download Alpine CLI archive
        uses: actions/download-artifact@v8.0.1
        with:
          name: PowerShell-${{ env.POWERSHELL_VERSION }}-linux-musl-${{ matrix.arch }}
          path: archives

      - name: Run Alpine archive
        shell: bash
        run: |
          docker run --rm -v "$PWD:/work:ro" "alpine:${{ matrix.alpine }}" \
            sh /work/package/linux/Test-PowerShellDistroAlpineArchive.sh \
            "/work/archives/PowerShell-$POWERSHELL_VERSION-linux-musl-${{ matrix.arch }}.tar.gz" \
            "$POWERSHELL_VERSION" "${{ matrix.arch }}"
