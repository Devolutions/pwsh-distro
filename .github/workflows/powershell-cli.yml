name: PowerShell CLI
on:
  workflow_dispatch:
    inputs:
      sdk_package_version:
        description: Optional SDK package version override (blank = use SDK_PACKAGE_VERSION)
        default: ""
        required: false
      sdk_artifact_run_id:
        description: Optional SDK workflow run ID whose nupkg artifact should be repackaged instead of SDK_PACKAGE_SOURCE
        default: ""
        required: false
      sdk_artifact_name:
        description: Optional SDK nupkg artifact name to repackage instead of SDK_PACKAGE_SOURCE
        default: ""
        required: false
      ready_to_run:
        description: Apply ReadyToRun optimization to packaged PowerShell managed assemblies
        required: true
        type: boolean
        default: false
  workflow_call:
    inputs:
      sdk_package_version:
        description: Optional SDK package version override (blank = use SDK_PACKAGE_VERSION)
        default: ""
        required: false
        type: string
      sdk_artifact_run_id:
        description: Optional SDK workflow run ID whose nupkg artifact should be repackaged instead of SDK_PACKAGE_SOURCE
        default: ""
        required: false
        type: string
      sdk_artifact_name:
        description: Optional SDK nupkg artifact name to repackage instead of SDK_PACKAGE_SOURCE
        default: ""
        required: false
        type: string
      ready_to_run:
        description: Apply ReadyToRun optimization to packaged PowerShell managed assemblies
        required: false
        type: boolean
        default: false
permissions:
  actions: read
  contents: read
env:
  POWERSHELL_VERSION: "7.6.3"
  POWERSHELL_RELEASE_TAG: "v7.6.3"
  POWERSHELL_UPSTREAM_TAG: "upstream/v7.6.3"
  POWERSHELL_SOURCE_REPOSITORY: ${{ github.repository }}
  POWERSHELL_SOURCE_REF: "downstream/v7.6.3"
  SDK_PACKAGE_ID: "Devolutions.PowerShell.SDK"
  SDK_PACKAGE_VERSION: "7.6.3.0"
  SDK_PACKAGE_REVISION: "0"
  SDK_PACKAGE_SOURCE: "https://api.nuget.org/v3/index.json"
jobs:
  build:
    name: PowerShell [${{matrix.arch}}-${{matrix.os}}]
    runs-on: ${{matrix.runner}}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            arch: x64
            runner: windows-2025
            rid: win-x64
          - os: windows
            arch: arm64
            runner: windows-2025
            rid: win-arm64
          - os: macos
            arch: x64
            runner: macos-15-intel
            rid: osx-x64
          - os: macos
            arch: arm64
            runner: macos-15
            rid: osx-arm64
          - os: linux
            arch: x64
            runner: ubuntu-24.04
            rid: linux-x64
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            rid: linux-arm64

    steps:
      - name: Enable Windows long path support
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Clone project with PowerShell submodule
        uses: actions/checkout@v7.0.0
        with:
          submodules: true
          fetch-depth: 0

      - name: Verify PowerShell source ref
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Invoke-GitPowerShell {
            param(
              [Parameter(Mandatory, ValueFromRemainingArguments)]
              [string[]] $Arguments
            )

            $Output = & git -C pwsh-src @Arguments
            if ($LASTEXITCODE -ne 0) {
              throw "git -C pwsh-src $($Arguments -join ' ') failed with exit code $LASTEXITCODE"
            }

            return $Output
          }

          function Test-GitCommitRef {
            param(
              [Parameter(Mandatory)]
              [string] $Ref
            )

            & git -C pwsh-src rev-parse --verify "$Ref^{commit}" *> $null
            return $LASTEXITCODE -eq 0
          }

          $ExpectedVersion = $Env:POWERSHELL_RELEASE_TAG -replace '^v', ''
          if ($Env:POWERSHELL_VERSION -ne $ExpectedVersion) {
            throw "POWERSHELL_VERSION '$Env:POWERSHELL_VERSION' does not match POWERSHELL_RELEASE_TAG '$Env:POWERSHELL_RELEASE_TAG'."
          }

          $SdkPackageVersion = '${{ inputs.sdk_package_version }}'.Trim()
          if ([string]::IsNullOrWhiteSpace($SdkPackageVersion)) {
            $SdkArtifactName = '${{ inputs.sdk_artifact_name }}'.Trim()
            if ($SdkArtifactName -match '^PowerShell-SDK-Release-(\d+\.\d+\.\d+\.\d+)$') {
              $SdkPackageVersion = $Matches[1]
            } else {
              $SdkPackageVersion = $Env:SDK_PACKAGE_VERSION
            }
          }

          $EscapedPowerShellVersion = [regex]::Escape($Env:POWERSHELL_VERSION)
          if ($SdkPackageVersion -notmatch "^$EscapedPowerShellVersion\.\d+$") {
            throw "SDK package version '$SdkPackageVersion' does not match expected PowerShell version prefix '$Env:POWERSHELL_VERSION'."
          }

          $SourceCommit = (Invoke-GitPowerShell rev-parse HEAD).Trim()
          Write-Host "PowerShell source: $Env:POWERSHELL_SOURCE_REPOSITORY@$Env:POWERSHELL_SOURCE_REF ($SourceCommit)"
          Write-Host "PowerShell SDK package: $Env:SDK_PACKAGE_ID $SdkPackageVersion from $Env:SDK_PACKAGE_SOURCE"

          $BaseRef = if ($Env:POWERSHELL_SOURCE_REPOSITORY -eq $Env:GITHUB_REPOSITORY) {
            $Env:POWERSHELL_UPSTREAM_TAG
          } else {
            $Env:POWERSHELL_RELEASE_TAG
          }

          if (-not (Test-GitCommitRef $BaseRef)) {
            throw "Expected PowerShell base tag '$BaseRef' was not found in the PowerShell checkout."
          }

          & git -C pwsh-src merge-base --is-ancestor "${BaseRef}^{commit}" HEAD
          if ($LASTEXITCODE -ne 0) {
            throw "PowerShell source ref '$Env:POWERSHELL_SOURCE_REF' is not based on '$BaseRef'."
          }

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5.3.0
        with:
          global-json-file: pwsh-src/global.json

      - name: Download current-run SDK package
        if: ${{ inputs.sdk_artifact_name != '' && inputs.sdk_artifact_run_id == '' }}
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ inputs.sdk_artifact_name }}
          path: sdk-package-source

      - name: Download previous-run SDK package
        if: ${{ inputs.sdk_artifact_run_id != '' }}
        uses: actions/download-artifact@v8.0.1
        with:
          run-id: ${{ inputs.sdk_artifact_run_id }}
          name: ${{ inputs.sdk_artifact_name || format('PowerShell-SDK-Release-{0}', inputs.sdk_package_version || env.SDK_PACKAGE_VERSION) }}
          path: sdk-package-source
          github-token: ${{ github.token }}

      - name: Package PowerShell distro from SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $OutputPath = Join-Path $PWD "PowerShell-$Env:POWERSHELL_VERSION-${{matrix.os}}-${{matrix.arch}}"
          $ArchivePath = "$OutputPath.tar.gz"
          $PackageScript = Join-Path (Join-Path $PWD 'eng') 'New-PowerShellDistroArchive.ps1'
          $PackageSource = $Env:SDK_PACKAGE_SOURCE
          $SdkPackageVersion = '${{ inputs.sdk_package_version }}'.Trim()
          if ([string]::IsNullOrWhiteSpace($SdkPackageVersion)) {
            $SdkArtifactName = '${{ inputs.sdk_artifact_name }}'.Trim()
            if ($SdkArtifactName -match '^PowerShell-SDK-Release-(\d+\.\d+\.\d+\.\d+)$') {
              $SdkPackageVersion = $Matches[1]
            } else {
              $SdkPackageVersion = $Env:SDK_PACKAGE_VERSION
            }
          }

          $SdkArtifactRunId = '${{ inputs.sdk_artifact_run_id }}'.Trim()
          $SdkArtifactName = '${{ inputs.sdk_artifact_name }}'.Trim()
          if ($SdkArtifactName -or $SdkArtifactRunId) {
            $PackageSource = Join-Path $PWD 'sdk-package-source'
            $SdkPackages = @(Get-ChildItem -LiteralPath $PackageSource -Filter "$($Env:SDK_PACKAGE_ID).*nupkg" -File)
            if ($SdkPackages.Count -ne 1) {
              $SourceDescription = if ($SdkArtifactRunId) { "SDK workflow run '$SdkArtifactRunId'" } else { "current workflow run artifact '$SdkArtifactName'" }
              throw "Expected exactly one $Env:SDK_PACKAGE_ID nupkg from $SourceDescription, found $($SdkPackages.Count)."
            }

            Write-Host "Using workflow-built SDK package: $($SdkPackages[0].FullName)"
          } else {
            Write-Host "Using SDK package source: $PackageSource"
          }

          $PackageArguments = @(
            '-PackageId',
            $Env:SDK_PACKAGE_ID,
            '-PackageVersion',
            $SdkPackageVersion,
            '-PackageSource',
            $PackageSource,
            '-PowerShellVersion',
            $Env:POWERSHELL_VERSION,
            '-RuntimeIdentifier',
            '${{matrix.rid}}',
            '-OutputDirectory',
            $OutputPath,
            '-ArchivePath',
            $ArchivePath
          )
          if ('${{ inputs.ready_to_run }}' -eq 'true') {
            $PackageArguments += '-ReadyToRun'
          }

          & $PackageScript @PackageArguments

      - name: Upload PowerShell package
        uses: actions/upload-artifact@v7.0.1
        with:
          name: PowerShell-${{env.POWERSHELL_VERSION}}-${{matrix.os}}-${{matrix.arch}}
          path: PowerShell-${{env.POWERSHELL_VERSION}}-${{matrix.os}}-${{matrix.arch}}.tar.gz
          if-no-files-found: error
