name: PowerShell MSIX
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release tag with Windows CLI archives (vX.Y.Z.R); leave blank to use a CLI run
        required: false
        default: ""
        type: string
      cli_run_id:
        description: CLI workflow run ID to package before publishing a release (requires package_version)
        required: false
        default: ""
        type: string
      package_version:
        description: X.Y.Z.R version when using cli_run_id (for example, 7.6.10.0)
        required: false
        default: ""
        type: string
      sign_msix:
        description: Sign the MSIX bundle with Azure Key Vault (requires code signing secrets)
        required: true
        type: boolean
        default: true
      github-env:
        description: GitHub environment containing code signing secrets
        required: true
        type: choice
        options:
          - publish-test
          - publish-prod
        default: publish-test
  workflow_call:
    inputs:
      package_version:
        required: true
        type: string
      cli_artifact_name:
        description: Current-run artifact containing release-ready CLI archives
        required: true
        type: string
      sign_msix:
        required: true
        type: boolean
      github-env:
        required: true
        type: string
      prepared_msix_artifacts:
        description: Test current-run MSIX bundle and App Installer artifacts already built and signed by release.yml
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

env:
  PSIGN_TOOL_PACKAGE_ID: "Devolutions.Psign.Tool"
  PSIGN_TOOL_PACKAGE_VERSION: "0.8.2"

jobs:
  build:
    name: MSIX bundle [win-x64+arm64]
    if: ${{ !inputs.prepared_msix_artifacts }}
    runs-on: windows-2025
    environment: ${{ inputs.sign_msix && inputs.github-env || '' }}
    steps:
      - name: Enable Windows long path support
        run: git config --system core.longpaths true

      - name: Clone project
        uses: actions/checkout@v7.0.0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5.3.0
        with:
          dotnet-version: "10.0.x"

      - name: Install pinned psign tool
        if: ${{ inputs.sign_msix }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ToolRoot = Join-Path $Env:RUNNER_TEMP 'psign-tool'
          New-Item -ItemType Directory -Path $ToolRoot -Force | Out-Null
          & dotnet tool install --tool-path $ToolRoot $Env:PSIGN_TOOL_PACKAGE_ID --version $Env:PSIGN_TOOL_PACKAGE_VERSION
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet tool install failed for $Env:PSIGN_TOOL_PACKAGE_ID with exit code $LASTEXITCODE"
          }
          $ToolRoot >> $Env:GITHUB_PATH

      - name: Test MSIX App Installer generation and bundle verification
        shell: pwsh
        env:
          SIGN_MSIX: ${{ inputs.sign_msix }}
        run: |
          $Args = @{}
          if ([bool]::Parse($Env:SIGN_MSIX)) {
            $Args.PsignToolPath = 'psign-tool'
          }
          & ./package/msix/Test-PowerShellDistroAppInstaller.ps1 @Args

      - name: Download current-run release-ready CLI archives
        if: ${{ inputs.cli_artifact_name != '' }}
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ inputs.cli_artifact_name }}
          path: archives

      - name: Download and package Windows MSIX bundle
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          CLI_RUN_ID: ${{ inputs.cli_run_id }}
          CLI_ARTIFACT_NAME: ${{ inputs.cli_artifact_name }}
          PACKAGE_VERSION: ${{ inputs.package_version }}
          SIGN_MSIX: ${{ inputs.sign_msix }}
          CODE_SIGNING_KEYVAULT_URL: ${{ secrets.CODE_SIGNING_KEYVAULT_URL }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          CODE_SIGNING_CLIENT_ID: ${{ secrets.CODE_SIGNING_CLIENT_ID }}
          CODE_SIGNING_CLIENT_SECRET: ${{ secrets.CODE_SIGNING_CLIENT_SECRET }}
          CODE_SIGNING_CERTIFICATE_NAME: ${{ secrets.CODE_SIGNING_CERTIFICATE_NAME }}
          CODE_SIGNING_TIMESTAMP_SERVER: ${{ vars.CODE_SIGNING_TIMESTAMP_SERVER }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($Env:CLI_ARTIFACT_NAME) {
            if ($Env:RELEASE_TAG -or $Env:CLI_RUN_ID -or $Env:PACKAGE_VERSION -notmatch '^\d+\.\d+\.\d+\.\d+$') {
              throw 'Current-run CLI artifact requires package_version and cannot be combined with release_tag or cli_run_id.'
            }
            $PackageVersion = $Env:PACKAGE_VERSION
          } elseif ($Env:RELEASE_TAG) {
            if ($Env:CLI_RUN_ID -or $Env:PACKAGE_VERSION) {
              throw 'Specify release_tag OR cli_run_id and package_version, not both.'
            }
            if ($Env:RELEASE_TAG -notmatch '^v(?<version>\d+\.\d+\.\d+\.\d+)$') {
              throw "Release tag must be vX.Y.Z.R: $Env:RELEASE_TAG"
            }
            $PackageVersion = $Matches.version
          } else {
            if ($Env:CLI_RUN_ID -notmatch '^\d+$' -or $Env:PACKAGE_VERSION -notmatch '^\d+\.\d+\.\d+\.\d+$') {
              throw 'Specify a numeric cli_run_id and an X.Y.Z.R package_version when release_tag is blank.'
            }
            $PackageVersion = $Env:PACKAGE_VERSION
          }

          $PowerShellVersion = $PackageVersion -replace '\.\d+$', ''
          $ArchiveDirectory = Join-Path $PWD 'archives'
          New-Item -ItemType Directory -Path $ArchiveDirectory -Force | Out-Null

          if ($Env:CLI_ARTIFACT_NAME) {
            Write-Host "Using current-run CLI artifact $Env:CLI_ARTIFACT_NAME."
          } elseif ($Env:RELEASE_TAG) {
            foreach ($Architecture in 'x64', 'arm64') {
              $ArchiveName = "PowerShell-$PowerShellVersion-windows-$Architecture.tar.gz"
              & gh release download $Env:RELEASE_TAG --repo $Env:GITHUB_REPOSITORY --pattern $ArchiveName --dir $ArchiveDirectory
              if ($LASTEXITCODE -ne 0) {
                throw "Unable to download $ArchiveName from $Env:RELEASE_TAG."
              }
            }
          } else {
            foreach ($Architecture in 'x64', 'arm64') {
              $ArtifactName = "PowerShell-$PowerShellVersion-windows-$Architecture"
              & gh run download $Env:CLI_RUN_ID --repo $Env:GITHUB_REPOSITORY --name $ArtifactName --dir $ArchiveDirectory
              if ($LASTEXITCODE -ne 0) {
                throw "Unable to download $ArtifactName from CLI run $Env:CLI_RUN_ID."
              }
            }
          }

          & ./package/msix/New-ReleasePowerShellDistroMsix.ps1 `
            -ArchiveDirectory $ArchiveDirectory `
            -PackageVersion $PackageVersion `
            -Repository $Env:GITHUB_REPOSITORY `
            -ReleaseTag "v$PackageVersion" `
            -SignMsix:([bool]::Parse($Env:SIGN_MSIX))

      - name: Upload PowerShell MSIX bundle and App Installer feed
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Devolutions-PowerShell-${{ inputs.release_tag || inputs.package_version }}-win-msix
          path: |
            output/msix/Devolutions-PowerShell-*-win.msixbundle
            output/msix/Devolutions-PowerShell.appinstaller
          if-no-files-found: error

  test:
    name: Test MSIX install [${{ matrix.arch }}]
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || (inputs.prepared_msix_artifacts && needs.build.result == 'skipped')) }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm
    steps:
      - name: Enable Windows long path support
        run: git config --system core.longpaths true

      - name: Clone project
        uses: actions/checkout@v7.0.0

      - name: Download PowerShell MSIX bundle and App Installer feed
        uses: actions/download-artifact@v8.0.1
        with:
          name: Devolutions-PowerShell-${{ inputs.release_tag || inputs.package_version }}-win-msix
          path: current-msix

      - name: Exercise MSIX verification, install, upgrade, execution, and uninstall
        shell: pwsh
        env:
          ARCHITECTURE: ${{ matrix.arch }}
          REQUIRE_SIGNATURE: ${{ inputs.sign_msix }}
        run: |
          $ErrorActionPreference = 'Stop'
          $Bundles = @(Get-ChildItem -LiteralPath ./current-msix -Filter 'Devolutions-PowerShell-*-win.msixbundle' -File)
          $Feeds = @(Get-ChildItem -LiteralPath ./current-msix -Filter 'Devolutions-PowerShell.appinstaller' -File)
          if ($Bundles.Count -ne 1 -or $Feeds.Count -ne 1) {
            throw "Expected one MSIX bundle and one App Installer feed, found $($Bundles.Count) bundle(s) and $($Feeds.Count) feed(s)."
          }

          $TestArgs = @{
            BundlePath = $Bundles[0].FullName
            AppInstallerPath = $Feeds[0].FullName
            Architecture = $Env:ARCHITECTURE
            AllowEphemeralTestSigning = $true
          }
          if ([bool]::Parse($Env:REQUIRE_SIGNATURE)) {
            $TestArgs.RequireSignature = $true
          }
          & ./package/msix/Test-PowerShellDistroMsixInstall.ps1 @TestArgs
