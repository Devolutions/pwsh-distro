name: PowerShell macOS pkg
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release tag with macOS CLI archives (vX.Y.Z.R); leave blank to use a CLI run
        required: false
        default: ""
        type: string
      cli_run_id:
        description: CLI workflow run ID to package before publishing a release (requires package_version)
        required: false
        default: ""
        type: string
      package_version:
        description: X.Y.Z.R version when using cli_run_id (for example, 7.6.9.0)
        required: false
        default: ""
        type: string
      sign_pkg:
        description: Developer ID sign and notarize the pkg (requires Apple signing secrets)
        required: true
        type: boolean
        default: true
      github-env:
        description: GitHub environment containing Apple signing secrets
        required: true
        type: choice
        options:
          - publish-prod
          - publish-test
        default: publish-prod
  workflow_call:
    inputs:
      package_version:
        required: true
        type: string
      cli_artifact_name:
        description: Current-run artifact containing release-ready CLI archives
        required: true
        type: string
      sign_pkg:
        required: true
        type: boolean
      github-env:
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  build:
    name: macOS pkg [osx-${{ matrix.arch }}]
    runs-on: macos-15
    environment: ${{ inputs.sign_pkg && inputs.github-env || '' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - name: Clone project
        uses: actions/checkout@v7.0.0

      - name: Download current-run release-ready CLI archives
        if: ${{ inputs.cli_artifact_name != '' }}
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ inputs.cli_artifact_name }}
          path: archives

      - name: Import Apple Developer ID certificates
        id: signing
        if: ${{ inputs.sign_pkg }}
        shell: bash
        env:
          APPLICATION_CERTIFICATE: ${{ secrets.APPLE_APP_DEV_ID_APP_CERTIFICATE }}
          APPLICATION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_APP_DEV_ID_APP_CERTIFICATE_PASSWORD }}
          INSTALLER_CERTIFICATE: ${{ secrets.APPLE_DEV_ID_INSTALLER_CERTIFICATE }}
          INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEV_ID_INSTALLER_CERTIFICATE_PASSWORD }}
          APPLE_BOT_PASSWORD: ${{ secrets.APPLE_BOT_PASSWORD }}
          DEVOLUTIONSBOT_TOKEN: ${{ secrets.DEVOLUTIONSBOT_TOKEN }}
        run: |
          set -euo pipefail
          for name in APPLICATION_CERTIFICATE APPLICATION_CERTIFICATE_PASSWORD INSTALLER_CERTIFICATE INSTALLER_CERTIFICATE_PASSWORD APPLE_BOT_PASSWORD DEVOLUTIONSBOT_TOKEN; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is required to sign and notarize the macOS pkg. Configure the Apple signing secrets in the ${{ inputs.github-env }} environment."
              exit 1
            fi
          done

          keychain="$RUNNER_TEMP/pwsh-distro-signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"

          certificate="$RUNNER_TEMP/pwsh-distro-signing.p12"
          trap 'rm -f "$certificate"' EXIT
          printf '%s' "$APPLICATION_CERTIFICATE" | base64 --decode > "$certificate"
          security import "$certificate" -k "$keychain" -P "$APPLICATION_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security
          printf '%s' "$INSTALLER_CERTIFICATE" | base64 --decode > "$certificate"
          security import "$certificate" -k "$keychain" -P "$INSTALLER_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security
          rm -f "$certificate"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null

          # productbuild resolves identities through the user keychain search list.
          existing_keychains=()
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"
            existing_keychains+=("${line//\"/}")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${existing_keychains[@]}"

          identities="$(security find-identity -v "$keychain")"
          application_identity="$(sed -nE 's/^ *[0-9]+\) [0-9A-F]{40} "(Developer ID Application: [^"]+)"$/\1/p' <<< "$identities" | head -n 1)"
          installer_identity="$(sed -nE 's/^ *[0-9]+\) [0-9A-F]{40} "(Developer ID Installer: [^"]+)"$/\1/p' <<< "$identities" | head -n 1)"
          if [[ -z "$application_identity" || -z "$installer_identity" ]]; then
            echo '::error::The Apple certificates must contain valid Developer ID Application and Developer ID Installer identities.'
            security find-identity -v "$keychain"
            exit 1
          fi
          echo "Application identity: $application_identity"
          echo "Installer identity: $installer_identity"
          {
            echo "keychain=$keychain"
            echo "application-identity=$application_identity"
            echo "installer-identity=$installer_identity"
          } >> "$GITHUB_OUTPUT"

      - name: Download and package macOS CLI
        id: package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          CLI_RUN_ID: ${{ inputs.cli_run_id }}
          CLI_ARTIFACT_NAME: ${{ inputs.cli_artifact_name }}
          PACKAGE_VERSION: ${{ inputs.package_version }}
          ARCHITECTURE: ${{ matrix.arch }}
          SIGNING_KEYCHAIN: ${{ steps.signing.outputs.keychain }}
          CODE_SIGNING_IDENTITY: ${{ steps.signing.outputs.application-identity }}
          INSTALLER_SIGNING_IDENTITY: ${{ steps.signing.outputs.installer-identity }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($Env:CLI_ARTIFACT_NAME) {
            if ($Env:RELEASE_TAG -or $Env:CLI_RUN_ID -or $Env:PACKAGE_VERSION -notmatch '^\d+\.\d+\.\d+\.\d+$') {
              throw 'Current-run CLI artifact requires package_version and cannot be combined with release_tag or cli_run_id.'
            }
            $PackageVersion = $Env:PACKAGE_VERSION
          } elseif ($Env:RELEASE_TAG) {
            if ($Env:CLI_RUN_ID -or $Env:PACKAGE_VERSION) {
              throw 'Specify release_tag OR cli_run_id and package_version, not both.'
            }
            if ($Env:RELEASE_TAG -notmatch '^v(?<version>\d+\.\d+\.\d+\.\d+)$') {
              throw "Release tag must be vX.Y.Z.R: $Env:RELEASE_TAG"
            }
            $PackageVersion = $Matches.version
          } else {
            if ($Env:CLI_RUN_ID -notmatch '^\d+$' -or $Env:PACKAGE_VERSION -notmatch '^\d+\.\d+\.\d+\.\d+$') {
              throw 'Specify a numeric cli_run_id and an X.Y.Z.R package_version when release_tag is blank.'
            }
            $PackageVersion = $Env:PACKAGE_VERSION
          }

          $PowerShellVersion = $PackageVersion -replace '\.\d+$', ''
          $ArchiveName = "PowerShell-$PowerShellVersion-macos-$Env:ARCHITECTURE.tar.gz"
          $ArchiveDirectory = Join-Path $PWD 'archives'
          $PayloadDirectory = Join-Path $PWD 'payload'
          New-Item -ItemType Directory -Path $ArchiveDirectory, $PayloadDirectory -Force | Out-Null

          if ($Env:CLI_ARTIFACT_NAME) {
            Write-Host "Using current-run CLI artifact $Env:CLI_ARTIFACT_NAME."
          } elseif ($Env:RELEASE_TAG) {
            & gh release download $Env:RELEASE_TAG --repo $Env:GITHUB_REPOSITORY --pattern $ArchiveName --dir $ArchiveDirectory
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to download $ArchiveName from $Env:RELEASE_TAG."
            }
          } else {
            $ArtifactName = "PowerShell-$PowerShellVersion-macos-$Env:ARCHITECTURE"
            & gh run download $Env:CLI_RUN_ID --repo $Env:GITHUB_REPOSITORY --name $ArtifactName --dir $ArchiveDirectory
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to download $ArchiveName from CLI run $Env:CLI_RUN_ID."
            }
          }
          $ArchivePath = Join-Path $ArchiveDirectory $ArchiveName
          if (-not (Test-Path -LiteralPath $ArchivePath -PathType Leaf)) {
            throw "CLI archive was not found: $ArchivePath"
          }

          & tar -xzf $ArchivePath -C $PayloadDirectory
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to extract $ArchivePath"
          }
          $OutputDirectory = Join-Path $PWD 'output/pkg'
          $PackageArguments = @{
            PayloadDirectory = $PayloadDirectory
            PackageVersion = $PackageVersion
            Architecture = $Env:ARCHITECTURE
            OutputDirectory = $OutputDirectory
          }
          if ($Env:CODE_SIGNING_IDENTITY) {
            $PackageArguments.CodeSigningIdentity = $Env:CODE_SIGNING_IDENTITY
            $PackageArguments.InstallerSigningIdentity = $Env:INSTALLER_SIGNING_IDENTITY
            $PackageArguments.Keychain = $Env:SIGNING_KEYCHAIN
          }
          & ./package/macos/New-PowerShellDistroMacPkg.ps1 @PackageArguments
          $PkgPath = Join-Path $OutputDirectory "Devolutions-PowerShell-$PackageVersion-osx-$Env:ARCHITECTURE.pkg"
          & ./package/macos/Test-PowerShellDistroMacPkg.ps1 -PkgPath $PkgPath -Architecture $Env:ARCHITECTURE -PackageVersion $PackageVersion -RequireSignature:([bool] $Env:CODE_SIGNING_IDENTITY)
          "pkg-path=$PkgPath" >> $Env:GITHUB_OUTPUT
          "package-version=$PackageVersion" >> $Env:GITHUB_OUTPUT

      - name: Checkout DevOps Apple notarization action
        if: ${{ inputs.sign_pkg }}
        uses: actions/checkout@v7.0.0
        with:
          repository: Devolutions/actions
          ref: v1
          token: ${{ secrets.DEVOLUTIONSBOT_TOKEN }}
          path: .ci/devolutions-actions
          persist-credentials: false

      - name: Notarize and staple macOS pkg
        if: ${{ inputs.sign_pkg }}
        uses: ./.ci/devolutions-actions/macos-notarize
        with:
          apple_password: ${{ secrets.APPLE_BOT_PASSWORD }}
          package_path: ${{ steps.package.outputs.pkg-path }}

      - name: Verify notarized macOS pkg
        if: ${{ inputs.sign_pkg }}
        shell: pwsh
        env:
          PKG_PATH: ${{ steps.package.outputs.pkg-path }}
          PACKAGE_VERSION: ${{ steps.package.outputs.package-version }}
          ARCHITECTURE: ${{ matrix.arch }}
        run: |
          $ErrorActionPreference = 'Stop'
          & ./package/macos/Test-PowerShellDistroMacPkg.ps1 -PkgPath $Env:PKG_PATH -Architecture $Env:ARCHITECTURE -PackageVersion $Env:PACKAGE_VERSION -RequireNotarization

      - name: Remove Apple signing keychain
        if: ${{ always() && steps.signing.outputs.keychain != '' }}
        shell: bash
        env:
          SIGNING_KEYCHAIN: ${{ steps.signing.outputs.keychain }}
        run: security delete-keychain "$SIGNING_KEYCHAIN" || true

      - name: Upload PowerShell macOS pkg
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Devolutions-PowerShell-${{ inputs.release_tag || inputs.package_version }}-osx-${{ matrix.arch }}-pkg
          path: output/pkg/*.pkg
          if-no-files-found: error

  test:
    name: Test macOS pkg install [${{ matrix.arch }}]
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    steps:
      - name: Clone project
        uses: actions/checkout@v7.0.0

      - name: Download macOS pkg installers
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: Devolutions-PowerShell-${{ inputs.release_tag || inputs.package_version }}-osx-*-pkg
          path: pkgs
          merge-multiple: true

      - name: Exercise pkg install, reinstall, and architecture guard
        shell: pwsh
        env:
          ARCHITECTURE: ${{ matrix.arch }}
          REQUIRE_NOTARIZATION: ${{ inputs.sign_pkg }}
        run: |
          $ErrorActionPreference = 'Stop'
          $Pkg = @(Get-ChildItem -LiteralPath ./pkgs -Filter "Devolutions-PowerShell-*-osx-$Env:ARCHITECTURE.pkg" -File)
          if ($Pkg.Count -ne 1 -or $Pkg[0].Name -notmatch '^Devolutions-PowerShell-(?<version>\d+\.\d+\.\d+\.\d+)-osx-') {
            throw "Expected one macOS pkg for $Env:ARCHITECTURE."
          }
          $TestArguments = @{
            PkgPath = $Pkg[0].FullName
            Architecture = $Env:ARCHITECTURE
            PackageVersion = $Matches.version
            Install = $true
            RequireNotarization = [System.Boolean]::Parse($Env:REQUIRE_NOTARIZATION)
          }
          # Apple silicon can install x86_64 packages through Rosetta, so only Intel hosts must refuse the other architecture.
          if ($Env:ARCHITECTURE -eq 'x64') {
            $OppositePkg = @(Get-ChildItem -LiteralPath ./pkgs -Filter '*-osx-arm64.pkg' -File)
            if ($OppositePkg.Count -ne 1) {
              throw 'Expected one arm64 pkg for the Intel cross-architecture test.'
            }
            $TestArguments.OppositePkgPath = $OppositePkg[0].FullName
          }
          & ./package/macos/Test-PowerShellDistroMacPkg.ps1 @TestArguments
