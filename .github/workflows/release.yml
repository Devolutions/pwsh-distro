name: PowerShell Release
on:
  workflow_dispatch:
    inputs:
      sdk_package_revision:
        description: Downstream SDK package revision override (blank = use SDK_PACKAGE_REVISION, auto = infer next release revision)
        default: ""
        required: false
      github-env:
        description: GitHub environment selection
        required: true
        type: choice
        options:
          - auto
          - test
          - prod
        default: auto
      skip-publish:
        description: Skip NuGet and GitHub Release publishing
        required: true
        type: boolean
        default: false
      dry-run:
        description: Dry run (simulate publishing)
        required: true
        type: boolean
        default: true
      sign-dry-run:
        description: Sign package during dry-run when signing secrets are available
        required: true
        type: boolean
        default: false
      ready_to_run:
        description: Apply ReadyToRun optimization to CLI archives and sign final R2R payloads when signing is enabled
        required: true
        type: boolean
        default: true
      use_custom_dotnet_runtime:
        description: Build the CLI against a source-built .NET runtime (runs dotnet-runtime.yml first unless dotnet_runtime_run_id is provided)
        required: false
        type: boolean
        default: false
      dotnet_runtime_run_id:
        description: Optional dotnet-runtime.yml run ID to reuse; leave blank to build in this workflow, or set latest to select the latest successful runtime run
        required: false
        default: ""

permissions:
  actions: read
  contents: read

env:
  SDK_PACKAGE_ID: "Devolutions.PowerShell.SDK"
  SDK_PACKAGE_SOURCE: "https://api.nuget.org/v3/index.json"
  PSIGN_TOOL_PACKAGE_ID: "Devolutions.Psign.Tool"
  PSIGN_TOOL_PACKAGE_VERSION: "0.7.0"

jobs:
  sdk:
    name: Build PowerShell SDK
    uses: ./.github/workflows/powershell-sdk.yml
    permissions:
      actions: read
      contents: read
    with:
      sdk_package_revision: ${{ inputs.sdk_package_revision }}
      github-env: ${{ inputs.github-env }}
      skip-publish: ${{ inputs.skip-publish }}
      dry-run: ${{ inputs.dry-run }}
      sign-dry-run: ${{ inputs.sign-dry-run }}
    secrets: inherit

  dotnet-runtime:
    name: Build source .NET runtime
    if: ${{ inputs.use_custom_dotnet_runtime == true && inputs.dotnet_runtime_run_id == '' }}
    uses: ./.github/workflows/dotnet-runtime.yml
    permissions:
      actions: read
      contents: read
    secrets: inherit

  cli:
    name: Build PowerShell CLI
    needs: [sdk, dotnet-runtime]
    if: ${{ always() && needs.sdk.result == 'success' }}
    uses: ./.github/workflows/powershell-cli.yml
    permissions:
      actions: read
      contents: read
    with:
      sdk_package_version: ${{ needs.sdk.outputs.sdk-package-version }}
      sdk_artifact_name: ${{ needs.sdk.outputs.release-sdk-package-artifact }}
      ready_to_run: ${{ inputs.ready_to_run }}
      use_custom_dotnet_runtime: ${{ inputs.use_custom_dotnet_runtime }}
      dotnet_runtime_run_id: ${{ inputs.dotnet_runtime_run_id || needs.dotnet-runtime.outputs.workflow-run-id }}
    secrets: inherit

  prepare-cli:
    name: Prepare release CLI archives and MSI installers
    runs-on: windows-2025
    needs: [sdk, cli]
    if: ${{ always() && needs.cli.result == 'success' }}
    environment: ${{ needs.sdk.outputs.package-env }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Enable Windows long path support
        run: git config --system core.longpaths true

      - name: Clone project with PowerShell submodule
        uses: actions/checkout@v7.0.0
        with:
          submodules: true

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5.3.0
        with:
          global-json-file: pwsh-src/global.json

      - name: Download PowerShell CLI packages
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: PowerShell-${{ needs.sdk.outputs.powershell-version }}-*
          path: cli-assets
          merge-multiple: true

      - name: Validate PowerShell CLI packages
        shell: pwsh
        run: |
          $PowerShellVersion = '${{ needs.sdk.outputs.powershell-version }}'
          $ExpectedArchives = @(
            foreach ($Platform in 'windows', 'macos', 'linux', 'linux-musl') {
              foreach ($Architecture in 'x64', 'arm64') {
                "PowerShell-$PowerShellVersion-$Platform-$Architecture.tar.gz"
              }
            }
          )
          $CliArchives = @(Get-ChildItem -LiteralPath ./cli-assets -Filter 'PowerShell-*.tar.gz' -File)
          if ($CliArchives.Count -ne $ExpectedArchives.Count -or @($ExpectedArchives | Where-Object { $_ -notin $CliArchives.Name }).Count -gt 0) {
            throw "Expected CLI archives $($ExpectedArchives -join ', '); found $($CliArchives.Name -join ', ')."
          }

      - name: Test archive signing metadata preservation
        shell: pwsh
        run: ./eng/Test-SignPowerShellDistroArchive.ps1

      - name: Install pinned psign tool
        if: ${{ fromJSON(needs.sdk.outputs.code-signed) }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $ToolRoot = Join-Path $Env:RUNNER_TEMP "psign-tool"
          Remove-Item -LiteralPath $ToolRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $ToolRoot | Out-Null

          dotnet tool install --tool-path $ToolRoot $Env:PSIGN_TOOL_PACKAGE_ID --version $Env:PSIGN_TOOL_PACKAGE_VERSION
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet tool install failed for $Env:PSIGN_TOOL_PACKAGE_ID with exit code $LASTEXITCODE"
          }

          $ToolRoot >> $Env:GITHUB_PATH

      - name: Code sign ReadyToRun PowerShell CLI archives
        if: ${{ fromJSON(needs.sdk.outputs.code-signed) && inputs.ready_to_run }}
        shell: pwsh
        env:
          CODE_SIGNING_KEYVAULT_URL: ${{ secrets.CODE_SIGNING_KEYVAULT_URL }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          CODE_SIGNING_CLIENT_ID: ${{ secrets.CODE_SIGNING_CLIENT_ID }}
          CODE_SIGNING_CLIENT_SECRET: ${{ secrets.CODE_SIGNING_CLIENT_SECRET }}
          CODE_SIGNING_CERTIFICATE_NAME: ${{ secrets.CODE_SIGNING_CERTIFICATE_NAME }}
          CODE_SIGNING_TIMESTAMP_SERVER: ${{ vars.CODE_SIGNING_TIMESTAMP_SERVER }}
        run: |
          $ErrorActionPreference = 'Stop'

          $SigningScript = Join-Path (Join-Path $PWD 'eng') 'Sign-PowerShellDistroArchive.ps1'
          foreach ($CliArchive in @(Get-ChildItem -LiteralPath ./cli-assets -Filter 'PowerShell-*.tar.gz' -File | Sort-Object Name)) {
            & $SigningScript -ArchivePath $CliArchive.FullName
          }

      - name: Upload release-ready CLI archives
        uses: actions/upload-artifact@v7.0.1
        with:
          name: PowerShell-Release-CLI-${{ needs.sdk.outputs.sdk-package-version }}
          path: cli-assets/PowerShell-*.tar.gz
          if-no-files-found: error

      - name: Build, sign, and verify PowerShell MSI installers
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.sdk.outputs.sdk-package-version }}
          SIGN_MSI: ${{ needs.sdk.outputs.code-signed }}
          CODE_SIGNING_KEYVAULT_URL: ${{ secrets.CODE_SIGNING_KEYVAULT_URL }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          CODE_SIGNING_CLIENT_ID: ${{ secrets.CODE_SIGNING_CLIENT_ID }}
          CODE_SIGNING_CLIENT_SECRET: ${{ secrets.CODE_SIGNING_CLIENT_SECRET }}
          CODE_SIGNING_CERTIFICATE_NAME: ${{ secrets.CODE_SIGNING_CERTIFICATE_NAME }}
          CODE_SIGNING_TIMESTAMP_SERVER: ${{ vars.CODE_SIGNING_TIMESTAMP_SERVER }}
        run: |
          & ./package/msi/New-ReleasePowerShellDistroMsi.ps1 `
            -ArchiveDirectory ./cli-assets -PackageVersion $Env:PACKAGE_VERSION `
            -SignMsi:([bool]::Parse($Env:SIGN_MSI))

      - name: Upload x64 PowerShell MSI
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Devolutions-PowerShell-${{ needs.sdk.outputs.sdk-package-version }}-win-x64-msi
          path: output/msi/Devolutions-PowerShell-*-win-x64.msi
          if-no-files-found: error

      - name: Upload ARM64 PowerShell MSI
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Devolutions-PowerShell-${{ needs.sdk.outputs.sdk-package-version }}-win-arm64-msi
          path: output/msi/Devolutions-PowerShell-*-win-arm64.msi
          if-no-files-found: error

      - name: Upload x64 previous-layout MSI test fixture
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Devolutions-PowerShell-legacy-${{ needs.sdk.outputs.sdk-package-version }}-win-x64-msi
          path: output/legacy-msi/Devolutions-PowerShell-*-win-x64.msi
          if-no-files-found: error

      - name: Upload ARM64 previous-layout MSI test fixture
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Devolutions-PowerShell-legacy-${{ needs.sdk.outputs.sdk-package-version }}-win-arm64-msi
          path: output/legacy-msi/Devolutions-PowerShell-*-win-arm64.msi
          if-no-files-found: error

  msi:
    name: Validate PowerShell MSI
    needs: [sdk, prepare-cli]
    if: ${{ always() && needs.prepare-cli.result == 'success' }}
    uses: ./.github/workflows/powershell-msi.yml
    permissions:
      actions: read
      contents: read
    with:
      package_version: ${{ needs.sdk.outputs.sdk-package-version }}
      cli_artifact_name: PowerShell-Release-CLI-${{ needs.sdk.outputs.sdk-package-version }}
      sign_msi: ${{ fromJSON(needs.sdk.outputs.code-signed) }}
      github-env: ${{ needs.sdk.outputs.package-env }}
      prepared_msi_artifacts: true
    secrets: inherit

  linux:
    name: Build and test PowerShell Linux packages
    needs: [sdk, prepare-cli]
    if: ${{ always() && needs.prepare-cli.result == 'success' }}
    uses: ./.github/workflows/powershell-linux.yml
    permissions:
      actions: read
      contents: read
    with:
      package_version: ${{ needs.sdk.outputs.sdk-package-version }}
      cli_artifact_name: PowerShell-Release-CLI-${{ needs.sdk.outputs.sdk-package-version }}

  macos-pkg:
    name: Build PowerShell macOS pkg
    needs: [sdk, prepare-cli]
    if: ${{ always() && needs.prepare-cli.result == 'success' }}
    uses: ./.github/workflows/powershell-macos-pkg.yml
    permissions:
      actions: read
      contents: read
    with:
      package_version: ${{ needs.sdk.outputs.sdk-package-version }}
      cli_artifact_name: PowerShell-Release-CLI-${{ needs.sdk.outputs.sdk-package-version }}

  publish:
    name: Publish PowerShell release
    runs-on: ubuntu-24.04
    needs: [sdk, cli, dotnet-runtime, prepare-cli, msi, linux, macos-pkg]
    if: ${{ always() && fromJSON(needs.sdk.outputs.skip-publish) == false && needs.prepare-cli.result == 'success' && needs.msi.result == 'success' && needs.linux.result == 'success' && needs.macos-pkg.result == 'success' }}
    environment: ${{ needs.sdk.outputs.package-env }}
    permissions:
      actions: read
      contents: write
      id-token: write

    steps:
      - name: Clone project
        uses: actions/checkout@v7.0.0
        with:
          submodules: true
          fetch-depth: 0

      - name: Export downstream PowerShell patch
        shell: pwsh
        env:
          POWERSHELL_SOURCE_REF: ${{ needs.sdk.outputs.powershell-source-ref }}
          POWERSHELL_RELEASE_TAG: ${{ needs.sdk.outputs.powershell-release-tag }}
          POWERSHELL_UPSTREAM_TAG: ${{ needs.sdk.outputs.powershell-upstream-tag }}
          SDK_PACKAGE_VERSION: ${{ needs.sdk.outputs.sdk-package-version }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($Env:POWERSHELL_SOURCE_REF)) {
            throw 'POWERSHELL_SOURCE_REF is empty.'
          }
          if ([string]::IsNullOrWhiteSpace($Env:POWERSHELL_RELEASE_TAG)) {
            throw 'POWERSHELL_RELEASE_TAG is empty.'
          }
          if ([string]::IsNullOrWhiteSpace($Env:POWERSHELL_UPSTREAM_TAG)) {
            throw 'POWERSHELL_UPSTREAM_TAG is empty.'
          }
          if ([string]::IsNullOrWhiteSpace($Env:SDK_PACKAGE_VERSION)) {
            throw 'SDK_PACKAGE_VERSION is empty.'
          }

          $ReleaseAssetsDir = Join-Path $PWD 'release-assets'
          $PatchScript = Join-Path $PWD 'scripts/Export-ReleasePowerShellPatch.ps1'
          & $PatchScript -RepositoryRoot $PWD -SourceRef $Env:POWERSHELL_SOURCE_REF -UpstreamRef $Env:POWERSHELL_UPSTREAM_TAG -ReleaseVersion $Env:SDK_PACKAGE_VERSION -OutputDir $ReleaseAssetsDir
          if ($LASTEXITCODE -ne 0) {
            throw "Patch export failed with exit code $LASTEXITCODE."
          }

      - name: Download PowerShell SDK package
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ needs.sdk.outputs.release-sdk-package-artifact }}
          path: release-assets

      - name: Download PowerShell CLI packages
        uses: actions/download-artifact@v8.0.1
        with:
          name: PowerShell-Release-CLI-${{ needs.sdk.outputs.sdk-package-version }}
          path: release-assets

      - name: Download PowerShell MSI packages
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: Devolutions-PowerShell-${{ needs.sdk.outputs.sdk-package-version }}-win-*-msi
          path: release-assets
          merge-multiple: true

      - name: Download PowerShell Linux packages
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: Devolutions-PowerShell-${{ needs.sdk.outputs.sdk-package-version }}-linux-*-packages
          path: release-assets
          merge-multiple: true

      - name: Download PowerShell macOS pkg installers
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: Devolutions-PowerShell-${{ needs.sdk.outputs.sdk-package-version }}-osx-*-pkg
          path: release-assets
          merge-multiple: true

      - name: NuGet login (OIDC)
        if: ${{ fromJSON(needs.sdk.outputs.dry-run) == false }}
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_BOT_USERNAME }}

      - name: Publish to nuget.org
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $DryRun = [System.Boolean]::Parse('${{ needs.sdk.outputs.dry-run }}')
          $NuGetApiKey = '${{ steps.nuget-login.outputs.NUGET_API_KEY }}'
          $PackageVersion = [version]::Parse('${{ needs.sdk.outputs.sdk-package-version }}')
          $NormalizedVersion = if ($PackageVersion.Revision -eq 0) {
            "$($PackageVersion.Major).$($PackageVersion.Minor).$($PackageVersion.Build)"
          } else {
            $PackageVersion.ToString()
          }
          $ExpectedPackageNames = @("$($Env:SDK_PACKAGE_ID).$NormalizedVersion.nupkg")
          $NugetPackages = @(Get-ChildItem -Path ./release-assets -Filter *.nupkg -File | Sort-Object Name)
          if ($NugetPackages.Count -ne $ExpectedPackageNames.Count -or @($ExpectedPackageNames | Where-Object { $_ -notin $NugetPackages.Name }).Count -gt 0) {
            throw "Expected SDK packages $($ExpectedPackageNames -join ', ') in ./release-assets; found $($NugetPackages.Name -join ', ')."
          }

          foreach ($NugetPackage in $NugetPackages) {
            $PackagePath = Resolve-Path -LiteralPath $NugetPackage.FullName -Relative
            Write-Host "Publishing $PackagePath to nuget.org"

            if ($DryRun) {
              Write-Host "Dry Run: skipping nuget.org publishing!"
              continue
            }

            if ([string]::IsNullOrWhiteSpace($NuGetApiKey)) {
              throw "NuGet/login did not provide a NuGet API key."
            }

            $PushArgs = @(
              'nuget', 'push', $PackagePath,
              '--api-key', $NuGetApiKey,
              '--source', $Env:SDK_PACKAGE_SOURCE,
              '--skip-duplicate', '--no-symbols'
            )
            & dotnet @PushArgs
            if ($LASTEXITCODE -ne 0) {
              throw "dotnet nuget push failed for $PackagePath with exit code $LASTEXITCODE"
            }
          }

      - name: Create GitHub release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: release-assets
        run: |
          $ErrorActionPreference = 'Stop'

          $DryRun = [System.Boolean]::Parse('${{ needs.sdk.outputs.dry-run }}')
          $PackageVersion = '${{ needs.sdk.outputs.sdk-package-version }}'
          $ReleaseTag = '${{ needs.sdk.outputs.release-tag }}'
          $ReleaseTitle = '${{ needs.sdk.outputs.release-title }}'
          $Repository = $Env:GITHUB_REPOSITORY
          $SourceCommit = '${{ needs.sdk.outputs.powershell-source-commit }}'
          $CodeSigned = '${{ needs.sdk.outputs.code-signed }}'

          $ParsedPackageVersion = [version]::Parse($PackageVersion)
          $NormalizedVersion = if ($ParsedPackageVersion.Revision -eq 0) {
            "$($ParsedPackageVersion.Major).$($ParsedPackageVersion.Minor).$($ParsedPackageVersion.Build)"
          } else {
            $ParsedPackageVersion.ToString()
          }
          $ExpectedPackageNames = @("$($Env:SDK_PACKAGE_ID).$NormalizedVersion.nupkg")
          $NugetPackages = @(Get-ChildItem -Filter *.nupkg -File | Sort-Object Name)
          if ($NugetPackages.Count -ne $ExpectedPackageNames.Count -or @($ExpectedPackageNames | Where-Object { $_ -notin $NugetPackages.Name }).Count -gt 0) {
            throw "Expected SDK packages $($ExpectedPackageNames -join ', ') in the release package directory; found $($NugetPackages.Name -join ', ')."
          }

          $PowerShellVersion = '${{ needs.sdk.outputs.powershell-version }}'
          $ExpectedArchives = @(
            foreach ($Platform in 'windows', 'macos', 'linux', 'linux-musl') {
              foreach ($Architecture in 'x64', 'arm64') {
                "PowerShell-$PowerShellVersion-$Platform-$Architecture.tar.gz"
              }
            }
          )
          $CliArchives = @(Get-ChildItem -File | Where-Object { $_.Name -like 'PowerShell-*.tar.gz' } | Sort-Object Name)
          if ($CliArchives.Count -ne $ExpectedArchives.Count -or @($ExpectedArchives | Where-Object { $_ -notin $CliArchives.Name }).Count -gt 0) {
            throw "Expected CLI archives $($ExpectedArchives -join ', '); found $($CliArchives.Name -join ', ')."
          }

          $MsiPackages = @(Get-ChildItem -File | Where-Object { $_.Name -like 'Devolutions-PowerShell-*.msi' } | Sort-Object Name)
          if ($MsiPackages.Count -ne 2) {
            throw "Expected exactly two PowerShell MSI installers in the release package directory, found $($MsiPackages.Count)."
          }

          $ExpectedLinuxPackages = @(
            foreach ($Architecture in 'x64', 'arm64') {
              $DebArchitecture = if ($Architecture -eq 'x64') { 'amd64' } else { 'arm64' }
              $RpmArchitecture = if ($Architecture -eq 'x64') { 'x86_64' } else { 'aarch64' }
              "devolutions-powershell_${PackageVersion}-1.deb_${DebArchitecture}.deb"
              foreach ($Distribution in 'rh', 'cm', 'azl4') {
                "devolutions-powershell-$PackageVersion-1.$Distribution.$RpmArchitecture.rpm"
              }
            }
          )
          $LinuxPackages = @(Get-ChildItem -File | Where-Object { $_.Name -like 'devolutions-powershell*.deb' -or $_.Name -like 'devolutions-powershell-*.rpm' } | Sort-Object Name)
          if ($LinuxPackages.Count -ne $ExpectedLinuxPackages.Count -or @($ExpectedLinuxPackages | Where-Object { $_ -notin $LinuxPackages.Name }).Count -gt 0) {
            throw "Expected Linux packages $($ExpectedLinuxPackages -join ', '); found $($LinuxPackages.Name -join ', ')."
          }

          $MacPackages = @(Get-ChildItem -File | Where-Object { $_.Name -like 'Devolutions-PowerShell-*-osx-*.pkg' } | Sort-Object Name)
          if ($MacPackages.Count -ne 2) {
            throw "Expected exactly two PowerShell macOS pkg installers in the release package directory, found $($MacPackages.Count)."
          }

          $PatchFiles = @(Get-ChildItem -File | Where-Object { $_.Name -like 'powershell-patch-*.patch' } | Sort-Object Name)
          if ($PatchFiles.Count -ne 1) {
            throw "Expected exactly one generated patch file in the release package directory, found $($PatchFiles.Count)."
          }

          $ReleaseAssetFiles = @($NugetPackages) + @($CliArchives) + @($MsiPackages) + @($LinuxPackages) + @($MacPackages) + @($PatchFiles)
          $ReleaseAssetFiles = @($ReleaseAssetFiles | Sort-Object Name)

          $HashPath = 'checksums'
          $ChecksumLines = foreach ($ReleaseAssetFile in $ReleaseAssetFiles) {
            $Hash = Get-FileHash -Algorithm SHA256 -LiteralPath $ReleaseAssetFile.FullName
            "$($Hash.Hash)  $($ReleaseAssetFile.Name)"
          }
          Set-Content -Path $HashPath -Value $ChecksumLines -Encoding ASCII

          echo "::group::checksums"
          Get-Content $HashPath
          echo "::endgroup::"

          $NotesPath = 'release-notes.md'
          $ReleaseNotes = @(
            "# $ReleaseTitle",
            "",
            "| Field | Value |",
            "| --- | --- |",
            "| Package ID | $Env:SDK_PACKAGE_ID |",
            "| Package version | $PackageVersion |",
            "| PowerShell upstream release | ${{ needs.sdk.outputs.powershell-release-tag }} |",
            "| PowerShell upstream source ref | ${{ needs.sdk.outputs.powershell-upstream-tag }} |",
            "| PowerShell downstream source ref | ${{ needs.sdk.outputs.powershell-source-ref }} |",
            "| PowerShell source commit | $SourceCommit |",
            "| Code signed | $CodeSigned |",
            "| CLI archives | $($CliArchives.Count) |",
            "| MSI installers | $($MsiPackages.Count) |",
            "| Linux packages | $($LinuxPackages.Count) |",
            "| macOS pkg installers | $($MacPackages.Count) |",
            "| Patch file | $($PatchFiles[0].Name) |"
          )
          Set-Content -Path $NotesPath -Value $ReleaseNotes -Encoding utf8

          if ($DryRun) {
            Write-Host "Dry Run: skipping GitHub release!"
          } else {
            $ReleaseAssets = @($ReleaseAssetFiles | ForEach-Object { $_.Name }) + $HashPath
            & gh release create $ReleaseTag --repo $Repository --target $Env:GITHUB_SHA --title $ReleaseTitle --notes-file $NotesPath @ReleaseAssets
            if ($LASTEXITCODE -ne 0) {
              throw "gh release create failed for $ReleaseTag with exit code $LASTEXITCODE"
            }
          }

      - name: Upload dry-run release assets
        if: ${{ fromJSON(needs.sdk.outputs.dry-run) }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: PowerShell-Release-DryRun-${{ needs.sdk.outputs.sdk-package-version }}
          path: release-assets/**
          if-no-files-found: error
