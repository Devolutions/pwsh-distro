name: PowerShell Linux packages
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release tag with Linux CLI archives (vX.Y.Z.R); leave blank to use a CLI run
        required: false
        default: ""
        type: string
      cli_run_id:
        description: CLI workflow run ID to package before publishing a release (requires package_version)
        required: false
        default: ""
        type: string
      package_version:
        description: X.Y.Z.R version when using cli_run_id (for example, 7.6.9.2)
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      package_version:
        required: true
        type: string
      cli_artifact_name:
        description: Current-run artifact containing release-ready CLI archives
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  build:
    name: Linux packages [${{ matrix.arch }}]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - name: Clone project
        uses: actions/checkout@v7.0.0

      - name: Install packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm

      - name: Download current-run release-ready CLI archives
        if: ${{ inputs.cli_artifact_name != '' }}
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ inputs.cli_artifact_name }}
          path: archives

      - name: Download and package Linux CLI
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          CLI_RUN_ID: ${{ inputs.cli_run_id }}
          CLI_ARTIFACT_NAME: ${{ inputs.cli_artifact_name }}
          PACKAGE_VERSION: ${{ inputs.package_version }}
          ARCHITECTURE: ${{ matrix.arch }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($Env:CLI_ARTIFACT_NAME) {
            if ($Env:RELEASE_TAG -or $Env:CLI_RUN_ID -or $Env:PACKAGE_VERSION -notmatch '^\d+\.\d+\.\d+\.\d+$') {
              throw 'Current-run CLI artifact requires package_version and cannot be combined with release_tag or cli_run_id.'
            }
            $PackageVersion = $Env:PACKAGE_VERSION
          } elseif ($Env:RELEASE_TAG) {
            if ($Env:CLI_RUN_ID -or $Env:PACKAGE_VERSION) {
              throw 'Specify release_tag OR cli_run_id and package_version, not both.'
            }
            if ($Env:RELEASE_TAG -notmatch '^v(?<version>\d+\.\d+\.\d+\.\d+)$') {
              throw "Release tag must be vX.Y.Z.R: $Env:RELEASE_TAG"
            }
            $PackageVersion = $Matches.version
          } else {
            if ($Env:CLI_RUN_ID -notmatch '^\d+$' -or $Env:PACKAGE_VERSION -notmatch '^\d+\.\d+\.\d+\.\d+$') {
              throw 'Specify a numeric cli_run_id and an X.Y.Z.R package_version when release_tag is blank.'
            }
            $PackageVersion = $Env:PACKAGE_VERSION
          }

          $ArchiveName = "PowerShell-$PackageVersion-linux-$Env:ARCHITECTURE.tar.gz"
          $ArchiveDirectory = Join-Path $PWD 'archives'
          $PayloadDirectory = Join-Path $PWD 'payload'
          New-Item -ItemType Directory -Path $ArchiveDirectory, $PayloadDirectory -Force | Out-Null

          if ($Env:CLI_ARTIFACT_NAME) {
            Write-Host "Using current-run CLI artifact $Env:CLI_ARTIFACT_NAME."
          } elseif ($Env:RELEASE_TAG) {
            & gh release download $Env:RELEASE_TAG --repo $Env:GITHUB_REPOSITORY --pattern $ArchiveName --dir $ArchiveDirectory
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to download $ArchiveName from $Env:RELEASE_TAG."
            }
          } else {
            $ArtifactName = "PowerShell-$PackageVersion-linux-$Env:ARCHITECTURE"
            & gh run download $Env:CLI_RUN_ID --repo $Env:GITHUB_REPOSITORY --name $ArtifactName --dir $ArchiveDirectory
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to download $ArchiveName from CLI run $Env:CLI_RUN_ID."
            }
          }
          $ArchivePath = Join-Path $ArchiveDirectory $ArchiveName
          if (-not (Test-Path -LiteralPath $ArchivePath -PathType Leaf)) {
            throw "Linux CLI archive was not found: $ArchivePath"
          }

          & tar -xzf $ArchivePath -C $PayloadDirectory
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to extract $ArchivePath"
          }

          foreach ($Distribution in 'deb', 'rh', 'cm', 'azl4') {
            & ./package/linux/New-PowerShellDistroLinuxPackage.ps1 `
              -PayloadDirectory $PayloadDirectory -PackageVersion $PackageVersion `
              -Architecture $Env:ARCHITECTURE -Distribution $Distribution `
              -OutputDirectory (Join-Path $PWD 'output/linux')
          }

          "PACKAGE_VERSION=$PackageVersion" >> $Env:GITHUB_ENV

      - name: Upload PowerShell Linux packages
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Devolutions.PowerShell-${{ env.PACKAGE_VERSION }}-linux-${{ matrix.arch }}-packages
          path: |
            output/linux/*.deb
            output/linux/*.rpm
          if-no-files-found: error

  test:
    name: Test ${{ matrix.target.package }} [${{ matrix.arch }} ${{ matrix.target.image }}]
    needs: build
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        target:
          - { package: deb, image: "ubuntu:22.04" }
          - { package: deb, image: "ubuntu:24.04" }
          - { package: deb, image: "debian:12" }
          - { package: deb, image: "debian:13" }
          - { package: rh, image: "registry.access.redhat.com/ubi8/ubi:latest" }
          - { package: rh, image: "registry.access.redhat.com/ubi9/ubi:latest" }
          - { package: rh, image: "registry.access.redhat.com/ubi10/ubi:latest" }
          - { package: rh, image: "fedora:latest" }
          - { package: cm, image: "mcr.microsoft.com/azurelinux/base/core:3.0" }
          - { package: azl4, image: "mcr.microsoft.com/azurelinux-beta/base/core:4.0" }
    steps:
      - name: Clone project
        uses: actions/checkout@v7.0.0

      - name: Download PowerShell Linux packages
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: Devolutions.PowerShell-*-linux-${{ matrix.arch }}-packages
          path: packages
          merge-multiple: true

      - name: Install, run, and remove package in ${{ matrix.target.image }}
        shell: pwsh
        env:
          ARCHITECTURE: ${{ matrix.arch }}
          DISTRIBUTION: ${{ matrix.target.package }}
          IMAGE: ${{ matrix.target.image }}
        run: |
          $ErrorActionPreference = 'Stop'
          $Pattern = switch ($Env:DISTRIBUTION) {
            'deb' { if ($Env:ARCHITECTURE -eq 'x64') { '*.deb_amd64.deb' } else { '*.deb_arm64.deb' } }
            default { if ($Env:ARCHITECTURE -eq 'x64') { "*.$Env:DISTRIBUTION.x86_64.rpm" } else { "*.$Env:DISTRIBUTION.aarch64.rpm" } }
          }
          $Packages = @(Get-ChildItem -LiteralPath ./packages -Filter $Pattern -File)
          if ($Packages.Count -ne 1) {
            throw "Expected one $Pattern package, found $($Packages.Count)."
          }
          if ($Packages[0].Name -notmatch '^devolutions-powershell[_-](?<version>\d+\.\d+\.\d+)\.\d+-') {
            throw "Unable to determine the PowerShell version from $($Packages[0].Name)."
          }
          $PowerShellVersion = $Matches.version

          & docker run --rm -v "${PWD}:/work" -w /work $Env:IMAGE `
            sh /work/package/linux/Test-PowerShellDistroLinuxPackage.sh "/work/packages/$($Packages[0].Name)" $PowerShellVersion
          if ($LASTEXITCODE -ne 0) {
            throw "Package test failed in $Env:IMAGE with exit code $LASTEXITCODE."
          }

  test-alpine-release:
    name: Test release-ready Alpine ${{ matrix.alpine }} [${{ matrix.arch }}]
    if: ${{ inputs.cli_artifact_name != '' }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        alpine: ["3.22", "3.23"]
    steps:
      - name: Clone project
        uses: actions/checkout@v7.0.0

      - name: Download release-ready CLI archives
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ inputs.cli_artifact_name }}
          path: archives

      - name: Run release-ready Alpine archive
        shell: bash
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
          ARCHITECTURE: ${{ matrix.arch }}
          ALPINE_VERSION: ${{ matrix.alpine }}
        run: |
          set -euo pipefail
          if [[ ! "$PACKAGE_VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+)\.[0-9]+$ ]]; then
            echo "Invalid package version: $PACKAGE_VERSION" >&2
            exit 1
          fi
          powershell_version="${BASH_REMATCH[1]}"
          archive="/work/archives/PowerShell-$PACKAGE_VERSION-linux-musl-$ARCHITECTURE.tar.gz"
          docker run --rm -v "$PWD:/work:ro" "alpine:$ALPINE_VERSION" \
            sh /work/package/linux/Test-PowerShellDistroAlpineArchive.sh \
            "$archive" "$powershell_version" "$ARCHITECTURE"
